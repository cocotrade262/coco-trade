apply plugin: 'com.android.application'

android {
    namespace = "com.asn.cocotrade"
    compileSdk = 35

    defaultConfig {
        applicationId "com.asn.cocotrade"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localProperties.load(new FileInputStream(localPropertiesFile))
        }
        def cloudinaryName = localProperties.getProperty('CLOUDINARY_CLOUD_NAME') ?: "dt8dfsjjv"
        def cloudinaryKey = localProperties.getProperty('CLOUDINARY_API_KEY') ?: "127825961938747"
        def cloudinarySecret = localProperties.getProperty('CLOUDINARY_API_SECRET') ?: System.getenv("CLOUDINARY_API_SECRET") ?: ""

        buildConfigField "String", "CLOUDINARY_CLOUD_NAME", "\"${cloudinaryName}\""
        buildConfigField "String", "CLOUDINARY_API_KEY", "\"${cloudinaryKey}\""
        buildConfigField "String", "CLOUDINARY_API_SECRET", "\"${cloudinarySecret}\""
    }

    signingConfigs {
        debug {
            def keystoreFile = file('permanent_debug.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        release {
            def keystoreFile = file('release.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword 'cocotrade123'
                keyAlias 'cocotrade-release'
                keyPassword 'cocotrade123'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.fragment:fragment:1.8.1"

    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'

    implementation 'com.cloudinary:cloudinary-android:3.0.2'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
    implementation "androidx.media3:media3-datasource:1.4.1"
    implementation "androidx.media3:media3-database:1.4.1"
    implementation "androidx.media3:media3-transformer:1.4.1"
    implementation "androidx.media3:media3-effect:1.4.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply plugin: 'com.google.gms.google-services'
