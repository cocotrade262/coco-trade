<!--
  Native scroll container instead of ion-content — Ionic's ion-content shadow layout
  often causes a huge top gap + phantom scrollbar on Android WebView inside nested tabs flex.
-->
<div class="postAdScroll">
  <div class="postAdInner">
    <header class="postAdScreenHeader">
      <div class="postAdScreenHeader__spacer"></div>
      <button
        type="button"
        class="postAd-btn postAd-btn--success postAd-headerBtn"
        (click)="publish()"
        [disabled]="busy || !selectedObjectUrl"
      >
        Post to feed
      </button>
    </header>

    <div class="postAdCard">
      <h2 class="postAdCard__title">Choose or record a video</h2>
      <p class="postAdCard__subtitle">Videos longer than 30 seconds will be trimmed.</p>

      <input
        #cameraInput
        type="file"
        accept="video/*"
        capture="environment"
        class="postAd-fileInput"
        [disabled]="busy"
        (change)="onFileSelected($event)"
        aria-label="Record video with camera"
        tabindex="-1"
      />

      <button
        type="button"
        class="postAd-btn postAd-btn--primary"
        [disabled]="busy"
        (click)="cameraInput.click()"
      >
        <span class="postAd-btn__stack">
          <span class="postAd-btn__title">Record video (camera)</span>
          <span class="postAd-btn__sub">Opens camera when supported</span>
        </span>
      </button>

      <input
        #fileInput
        type="file"
        accept="video/*"
        class="postAd-fileInput"
        [disabled]="busy"
        (change)="onFileSelected($event)"
        aria-label="Select video file from device"
        tabindex="-1"
      />

      <button
        type="button"
        class="postAd-btn postAd-btn--primary"
        [disabled]="busy"
        (click)="fileInput.click()"
      >
        <span class="postAd-btn__stack">
          <span class="postAd-btn__title">Select video file</span>
          <span class="postAd-btn__sub">Pick from your device / laptop</span>
        </span>
      </button>

      <div class="preview" *ngIf="selectedObjectUrl">
        <video class="preview__video" [src]="selectedObjectUrl" controls playsinline></video>
        <div class="preview__meta">
          Duration: {{ durationSec | number: '1.0-0' }}s
          <span *ngIf="(durationSec ?? 0) > 30" class="trim-badge">(will be trimmed to 30s)</span>
        </div>
      </div>

      <div class="post-fields">
        <div class="coco-field">
          <label class="coco-label" for="postCaption">Caption (optional)</label>
          <input
            id="postCaption"
            type="text"
            class="coco-input"
            [(ngModel)]="caption"
            placeholder="Ex: Fresh coconuts available in my area"
            autocapitalize="sentences"
            enterkeyhint="done"
          />
        </div>

        <div class="coco-row">
          <div class="coco-field">
            <label class="coco-label" for="postName">Name</label>
            <input id="postName" type="text" class="coco-input" [(ngModel)]="name" placeholder="Your name" />
          </div>
          <div class="coco-field">
            <label class="coco-label" for="postMobile">Mobile Number</label>
            <input id="postMobile" type="tel" class="coco-input" [(ngModel)]="mobile" placeholder="Mobile number" />
          </div>
        </div>

        <div class="coco-row">
          <div class="coco-field">
            <label class="coco-label" for="postArea">Area</label>
            <input id="postArea" type="text" class="coco-input" [(ngModel)]="area" placeholder="Village / Town" />
          </div>
          <div class="coco-field">
            <label class="coco-label" for="postCost">Cost</label>
            <input id="postCost" type="text" class="coco-input" [(ngModel)]="cost" placeholder="Price/Rate" />
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
