<ion-header>
  <ion-toolbar>
    <ion-title>Contact details</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="contactFields">
    <div class="coco-row">
      <div class="coco-field">
        <label class="coco-label" for="contactName">Name</label>
        <input
          id="contactName"
          class="coco-input"
          type="text"
          [(ngModel)]="name"
          placeholder="Seller name"
          autocomplete="name"
        />
      </div>

      <div class="coco-field">
        <label class="coco-label" for="contactMobile">Mobile</label>
        <input
          id="contactMobile"
          class="coco-input"
          type="tel"
          [(ngModel)]="mobile"
          placeholder="Mobile number"
          inputmode="tel"
          autocomplete="tel"
        />
      </div>
    </div>

    <div class="coco-row">
      <div class="coco-field">
        <label class="coco-label" for="contactPlace">Area</label>
        <input
          id="contactPlace"
          class="coco-input"
          type="text"
          [(ngModel)]="place"
          placeholder="Village / Town"
          autocomplete="address-level2"
        />
      </div>

      <div class="coco-field">
        <label class="coco-label" for="contactCost">Cost</label>
        <input
          id="contactCost"
          class="coco-input"
          type="text"
          [(ngModel)]="cost"
          placeholder="Price/Rate"
        />
      </div>
    </div>
  </div>

  <ion-button expand="block" color="success" class="saveBtn" (click)="save()">
    Update Details
  </ion-button>
</ion-content>
