<ion-header>
  <ion-toolbar>
    <ion-title>Contact details</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancel()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding coco-sheet">
  <div class="contact-info-list">
    <div class="contact-info-item">
      <ion-icon name="person-outline"></ion-icon>
      <div class="contact-info-item__content">
        <label>Seller Name</label>
        <input type="text" [(ngModel)]="name" placeholder="Name" />
      </div>
    </div>

    <div class="contact-info-item">
      <ion-icon name="call-outline"></ion-icon>
      <div class="contact-info-item__content">
        <label>Mobile Number</label>
        <input type="tel" [(ngModel)]="mobile" placeholder="Mobile" />
      </div>
    </div>

    <div class="contact-info-item">
      <ion-icon name="location-outline"></ion-icon>
      <div class="contact-info-item__content">
        <label>Area / Place</label>
        <input type="text" [(ngModel)]="place" placeholder="Location" />
      </div>
    </div>

    <div class="contact-info-item">
      <ion-icon name="cash-outline"></ion-icon>
      <div class="contact-info-item__content">
        <label>Expected Cost</label>
        <input type="text" [(ngModel)]="cost" placeholder="Cost" />
      </div>
    </div>
  </div>

  <div class="coco-sheet__actions">
    <ion-button expand="block" color="success" shape="round" class="coco-save-btn" (click)="save()">
      Update Details
    </ion-button>
  </div>
</ion-content>
