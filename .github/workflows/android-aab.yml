name: Android AAB (release)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Verify google-services.json
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "SUCCESS: google-services.json found!"
          else
            echo "ERROR: google-services.json is missing!"
            exit 1
          fi

      - name: Build release AAB
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease
        env:
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
