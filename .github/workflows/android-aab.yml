name: Android AAB (debug)

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'

      - name: Create Placeholder google-services.json
        run: |
          mkdir -p app
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"0","project_id":"placeholder","storage_bucket":"placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.cocotrade"}},"oauth_client":[{"client_id":"placeholder.apps.googleusercontent.com","client_type":3}],"api_key":[{"current_key":"placeholder"}],"services":{"appinvite_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Build debug AAB
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleDebug

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/android/app/build/outputs/bundle/debug/app-debug.aab
