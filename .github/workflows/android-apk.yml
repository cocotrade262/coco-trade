name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Verify google-services.json Location
        run: |
          if [ -f "app/android/app/google-services.json" ]; then
            echo "SUCCESS: google-services.json found!"
          else
            echo "ERROR: google-services.json is missing!"
            exit 1
          fi

      # Automatically checks for an existing saved key, preventing a new random SHA-1
      - name: Load or Generate Permanent Keystore File
        run: |
          if [ -f "app/android/app/permanent_debug.keystore" ]; then
            echo "Permanent key found! Reusing it to lock down your SHA-1..."
            cp app/android/app/permanent_debug.keystore ~/.android/debug.keystore
          else
            echo "First run: Creating a brand new permanent key file..."
            mkdir -p ~/.android
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Automatically commits the generated key back to your GitHub repo so it freezes forever
      - name: Commit Keystore Back To Repository
        run: |
          if [ ! -f "app/android/app/permanent_debug.keystore" ]; then
            echo "Freezing this signature in your code branch permanently..."
            mkdir -p app/android/app
            cp ~/.android/debug.keystore app/android/app/permanent_debug.keystore
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@://github.com"
            git add app/android/app/permanent_debug.keystore
            git commit -m "chore: freeze android signature key [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Key is already frozen in your repository. Skipping save."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coco-trade-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
