name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: 'gradle'

      - name: Verify google-services.json Location
        run: |
          if [ -f "app/android/app/google-services.json" ]; then
            echo "SUCCESS: google-services.json found!"
          else
            echo "ERROR: google-services.json is missing!"
            exit 1
          fi

      - name: Build Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Sign APK with Permanent Key
        uses: rrascacachon/sign-android-apk@v1
        id: sign_app
        with:
          releaseDirectory: app/android/app/build/outputs/apk/debug
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coco-trade-apk
          path: ${{ steps.sign_app.outputs.signedAPK }}
