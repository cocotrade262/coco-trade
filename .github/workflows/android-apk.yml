name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: 'gradle'

      - name: Create placeholder google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "Creating placeholder google-services.json"
            echo '{"project_info":{"project_number":"123","project_id":"dummy","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.example.cocotrade"}},"api_key":[{"current_key":"dummy_key"}],"services":{"appinvite_service":{"status":1}}}]}' > app/google-services.json
          else
            echo "google-services.json already exists"
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coco-trade-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
