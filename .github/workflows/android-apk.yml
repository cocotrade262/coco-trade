  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: 'gradle'

      - name: Create google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/main/res/values
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" > app/google-services.json
          else
            echo '{"project_info":{"project_number":"0","project_id":"placeholder","storage_bucket":"placeholder"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.cocotrade"}},"oauth_client":[{"client_id":"://googleusercontent.com","client_type":3}],"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
            echo '<resources><string name="default_web_client_id">placeholder</string></resources>' > app/src/main/res/values/ci_strings.xml
          fi

      - name: Decode Keystore
        run: |
          # Download the clean binary keystore directly to bypass base64 processing entirely
          curl -sL "https://github.com" -o release.keystore
          mkdir -p app
          cp release.keystore app/release.keystore
          cp release.keystore ../release.keystore

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          ANDROID_KEYSTORE_FILE: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coco-trade-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
