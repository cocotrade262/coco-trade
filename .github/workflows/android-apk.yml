name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
