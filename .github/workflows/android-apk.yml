name: Build Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'gradle'

      - name: Verify google-services.json Location
        run: |
          if [ -f "app/android/app/google-services.json" ]; then
            echo "SUCCESS: google-services.json found!"
          else
            echo "ERROR: google-services.json is missing!"
            exit 1
          fi

      # This creates a brand new, permanent keystore file inside your pipeline using your passwords
      - name: Auto-Generate Permanent Keystore
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS_NAME: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -genkey -v \
            -keystore github_release.keystore \
            -alias "$ALIAS_NAME" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=CocoTrade, OU=Dev, O=Coco, L=Hyd, S=TS, C=IN"

      - name: Build Signed Debug APK
        working-directory: app/android
        env:
          SIGNING_STORE_FILE: "${{ github.workspace }}/github_release.keystore"
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file=$SIGNING_STORE_FILE \
            -Pandroid.injected.signing.store.password=$SIGNING_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$SIGNING_KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$SIGNING_KEY_PASSWORD

      # This prints out the exact SHA-1 of the new permanent key to your GitHub Build Log so you can grab it
      - name: Display Permanent SHA-1 Fingerprint
        run: |
          echo "=================================================================="
          echo "COPY THIS NEW PERMANENT SHA-1 CODE AND PASTE IT INTO FIREBASE:"
          keytool -list -v -keystore github_release.keystore -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} | grep SHA1
          echo "=================================================================="

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coco-trade-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
