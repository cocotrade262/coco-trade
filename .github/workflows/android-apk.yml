        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: 'gradle'

      - name: Create google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app/src/main/res/values
          if [ -n "$GS_JSON" ]; then
